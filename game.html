<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EscapeX Game</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/game.css"></head>
<body>
<header class="hud"><a class="logo" href="cases.html">← ESCAPE<span>X</span></a>
<div><span id="caseName"></span> · ROOM <b id="roomNum"></b> · ⏱ <b id="timer"></b> · ⭐ <b id="score"></b></div>
<button id="soundBtn">🔊</button></header>
<main class="game-layout">
<section><div class="scene-head"><p id="theme" class="eyebrow"></p><h1 id="roomTitle"></h1><p id="story"></p></div>
<div id="room" class="room"><div class="ambient"></div><div id="objects"></div></div>
<p class="instruction">✨ Click the objects in the room to investigate them.</p></section>
<aside><h3>🎒 Evidence</h3><div id="inventory"></div><hr><p>💡 Hints: <b id="hints"></b></p>
<button id="hintBtn">Reveal Hint (-50)</button><button id="restartBtn" class="danger">↻ Restart Case</button></aside>
</main>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="closeBtn" class="x">×</button><div id="modalContent"></div></div></div>
<script src="js/game-data.js"></script><script src="js/game.js"></script></body></html>
